name: ctrip-train-e2e

# 目前**手动触发**为主。定时任务暂缓：M1-2（-m ui 与前缀标准化）刚合入，
# 要先手动跑一轮确认 verdict / gate / ratio 的语义与 ledger 一致，再打开定时。
# 打开时恢复下面三行并去掉注释即可。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 0 * * *"      # UTC 00:30 = 北京时间 08:30，避开整点高峰

# 写 ops/metrics 分支需要 contents: write
permissions:
  contents: write

# 同一时刻只允许一个写账本的 run。两个并发 run 各自 fetch 同一个 tip 再 push，
# 后一个必然非快进——重试救不了，只能串行。
concurrency:
  group: blocked-ledger
  cancel-in-progress: false

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://trains.ctrip.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 数据质量校验（先于浏览器）
        # 纯离线、约 2 秒。数据配错要在装浏览器之前就红 ——
        # 否则表现为「某条 UI 用例莫名失败」，查半天才发现是 yaml 里一个数字写错。
        run: python -m pytest tools/tests/test_case_data.py -q

      - name: 安装浏览器
        run: python -m playwright install --with-deps chromium

      - name: 安装 xvfb（trains 需要显示服务）
        # trains.ctrip.com 在无头模式下整站返回 432 `whaleguard block`，有头才 200
        # （2026-11-01 实测：有头 200/953 字符、无头 432/17 字符，同一分钟对照）。
        # xvfb 是在无显示服务的机器上提供一块虚拟屏，让 Chromium 能以有头模式启动；
        # 它不改变浏览器对外暴露的身份，也不改任何断言。
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 取回 ledger（G3/G4 要历史）
        run: |
          mkdir -p .ledger
          # 刻意不加 --depth=1：浅取会在 .git/shallow 里留下边界，
          # 之后 `git log` 在该 commit 处直接截断、`%p` 显示为空，
          # 看起来像「这是个孤儿根提交」—— 2026-11-01 本地就这么被骗过一次。
          # 这个分支只有 2 个文件，全量取回没有成本。
          git fetch origin ops/metrics
          git show FETCH_HEAD:ops/blocked-ledger.jsonl > .ledger/blocked-ledger.jsonl
          echo "已取回 $(wc -l < .ledger/blocked-ledger.jsonl) 行历史"

      - name: UI 用例（独立 junit，供门禁消费）
        id: ui
        continue-on-error: true       # blocked 是 xfail，pytest 本身退出 0；真失败由 G0 兜
        env:
          HEADED: "1"                 # 有头：无头下 trains 恒被 432 拦，轨道会永远红
          HUMAN: "0"                  # 关键：HEADED=1 会自动开拟人，CI 必须显式关掉
        run: |
          mkdir -p reports
          xvfb-run -a python -m pytest suites/thirdparty -m ui --junitxml=reports/junit-ui.xml

      - name: blocked 门禁
        id: gate
        continue-on-error: true       # 红了也要先落记录，再由最后一步把 job 弄红
        run: |
          python tools/blocked_gate.py reports/junit-ui.xml --scope ui \
            --ledger .ledger/blocked-ledger.jsonl \
            --record-out reports/gate-record.json

      - name: 追加 ledger 并读回校验
        if: always() && steps.gate.outcome != 'skipped'
        run: python tools/ledger_append.py reports/gate-record.json

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}
          path: |
            reports/
            .ledger/
          retention-days: 14
          if-no-files-found: warn

      - name: 门禁红 / 契约不成立 / 真失败 ⇒ job 红
        if: steps.gate.outcome == 'failure' || steps.ui.outcome == 'failure'
        run: |
          echo "::error::门禁或用例失败，详见上一步输出与 reports/gate-record.json"
          exit 1

# ---------------------------------------------------------------- 酒店轨道（草案，未启用）
