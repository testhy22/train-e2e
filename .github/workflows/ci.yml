#   2. 14 天阈值校准完成（docs/BLOCKED-GATE.md §6），PROVISIONAL 置 False；
#   3. 手动跑通本 job 至少一次：workflow_dispatch 单独跑，确认 verdict / gate / ratio 与账本一致。
