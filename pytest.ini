[pytest]
# 两个根：suites/ 是被测对象相关的用例，tools/tests/ 是门禁与账本自身的小测试。
testpaths = suites tools/tests
python_files = test_*.py

# --tracing=retain-on-failure：失败即证据。本工程不装 pytest-rerunfailures，
#   on-first-retry 在无重试的配置下永远产不出 trace（见 PROJECT-PLAN 5.D2）。
# --output=reports/trace：trace.zip 落到 reports/trace/<用例名>/ 下。
addopts = -ra --strict-markers --tracing=retain-on-failure --output=reports/trace --html=reports/html/report.html --self-contained-html

# 单条用例最长 180 秒。挂在真站点上「无限等」会让整个 job 卡到 job 级超时，
# 超时本身是失败的一种，必须由用例级 timeout 兜住。依赖 requirements.txt 里的 pytest-timeout。
timeout = 180

markers =
    ui: 驱动浏览器的用例（scope=ui，火车票轨道）。**blocked 门禁只吃带 ui/hotels 标记的用例**，
        数据层单测不得带
    smoke: 只打开页面、检测风控、记录标题与 URL，不做任何交互
    hotels: 酒店搜索轨道（scope=ui_hotels，www.ctrip.com 首页酒店模块）。单独一条轨道是因为
        BASE_URL 与账户口径都不同：火车票走 trains.ctrip.com，酒店走 www.ctrip.com（D1 裁决 2026-11-01）。
        带 hotels 标记的用例 scope 取 ui_hotels（优先于 ui），账本里独立一条 G3/G4 序列

# 刻意不配 junit_family：默认 xunit2 就是门禁解析所依赖的格式；
# 换成 xunit1 会改变 skipped 元素与属性的写法，门禁得跟着改，收益为零。
