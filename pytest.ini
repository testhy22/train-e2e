[pytest]
# 两个根：suites/ 是被测对象相关的用例，tools/tests/ 是门禁与账本自身的小测试。
testpaths = suites tools/tests
python_files = test_*.py

# --tracing=retain-on-failure：失败即证据。本工程不装 pytest-rerunfailures，
#   on-first-retry 在无重试的配置下永远产不出 trace（见 PROJECT-PLAN 5.D2）。
# --output=reports/trace：trace.zip 落到 reports/trace/<用例名>/ 下。
# --alluredir：Allure 原始结果。**故意不加 --clean-alluredir** —— history 就存在
#   这个目录里，每次清掉的话趋势图永远只有一根柱子（见 utils/allure_support.build_history）。
#   pytest-html 的 --html 保留：它是「不需要 Java 也能看」的兜底产物。
# 并发与重试一律关闭（2026-11-07 用户要求，从「频率」维度限制访问强度）：
#   `-p no:xdist`          —— 本机装了 pytest-xdist，任何人 `-n 4` 都会把三条 e2e 轨道
#                             同时打向同一站点，这是最典型的批量特征。禁掉插件，
#                             `-n` 参数直接不存在，而不是「约定不要用」。
#   `-p no:rerunfailures`  —— 当前未安装；照样写上，防止以后装上后「失败自动重试」
#                             悄悄把一次被拦掩盖成一次通过。被拦的正确出口是
#                             blocked → xfail（docs/BLOCKED-GATE.md），不是重试。
addopts = -p no:xdist -p no:rerunfailures -ra --strict-markers --tracing=retain-on-failure --output=reports/trace --alluredir=reports/allure-results --html=reports/html/report.html --self-contained-html

# 单条用例最长 180 秒。挂在真站点上「无限等」会让整个 job 卡到 job 级超时，
# 超时本身是失败的一种，必须由用例级 timeout 兜住。依赖 requirements.txt 里的 pytest-timeout。
timeout = 180

# 访问强度（2026-11-07 用户要求，三个维度，全部在 utils/throttle.py）：
#   1) 动作间隔 15s   E2E_MIN_ACTION_INTERVAL_S（挂在 goto 与各站提交前）
#   2) 用例间隔 30s   E2E_CASE_GAP_S（autouse fixture，只对 ui/hotels/auth/e2e 生效）
#   3) 每小时配额 5 次 E2E_HOURLY_QUOTA（**跨运行**，落盘 .e2e-state/quota.json）
#      —— 超额默认 skip（`quota:` 前缀，不进分母）；要真等到窗口滑出设 E2E_QUOTA_WAIT=1。
# 一次只碰一个功能：E2E_MODULES=trains / hotels / flights / auto（随机一个）/ all（默认）。
# 注意：`-m` 用的是 marker，`E2E_MODULES` 是 e2e 串联轨道的收集期裁剪，两者不冲突。

markers =
    ui: 驱动浏览器的用例（scope=ui，火车票轨道）。**blocked 门禁只吃带 ui/hotels 标记的用例**，
        数据层单测不得带
    smoke: 只打开页面、检测风控、记录标题与 URL，不做任何交互
    hotels: 酒店搜索轨道（scope=ui_hotels，www.ctrip.com 首页酒店模块）。单独一条轨道是因为
        BASE_URL 与账户口径都不同：火车票走 trains.ctrip.com，酒店走 www.ctrip.com（D1 裁决 2026-11-01）。
        带 hotels 标记的用例 scope 取 ui_hotels（优先于 ui），账本里独立一条 G3/G4 序列
    auth: 登录态轨道（scope=ui_auth，2026-11-01 新增）。依赖 config/auth/ctrip_state.json
        —— 一份由**真人扫码**产生、绝不入库的会话凭据。
        **不要**与 ui / hotels 同时标记：那样会把「匿名态能拿到什么」的比例换成
        「今天扫没扫码的比例」，两条既有序列都会被污染。
        缺文件时 pytest.skip("known-limit: AUTH-01 …")，不进分母，也不让 CI 永久红
    e2e: 跨模块串联轨道（scope=ui_e2e，2026-11-01 新增）。一次登录、一个 context、
        一个 page，依次跑 酒店 → 火车 → 机票，每模块 3~4 组数据。
        依赖 www + trains **两份**登录态：`shared_context` 会把 trains 那份里的
        `trains.ctrip.com` 专属 cookie 合并进来（两站登录态不互通，K-07），
        缺 www 那份时 skip("known-limit: AUTH-06 …")，缺 trains 那份只降级为
        「火车票未登录」并在日志里写明，不整轨 skip。
        **不要**与 auth / hotels / ui 同时标记：那三条轨道的实验条件是
        「每条用例一个干净 context」，本轨道要验的恰恰是「连续搜索不重启、不重登」，
        混标记会让两边的结论互相污染

# 刻意不配 junit_family：默认 xunit2 就是门禁解析所依赖的格式；
# 换成 xunit1 会改变 skipped 元素与属性的写法，门禁得跟着改，收益为零。
