# 火车票冒烟用例数据
#
# 字段
#   id                  用例标识：小写字母数字与 - _，**必须是 ASCII**（理由同酒店）
#   name                中文名，只用于报告展示
#   from_city/to_city   城市名，必须能命中目标站点的联想下拉
#   depart_offset_days  相对今天的天数：下限 +3、上限 = 预售期（见 settings.MAX_PRESALE_DAYS）
#   min_results         结果条目数下界
#   expected_keyword    弱条件，只写进日志与报告，不参与 pass/fail
#   tags                `-k` 过滤用
#   expected            `http_status` 是硬预期：无头下该站返回 432，见 KNOWN-LIMITATIONS K-05，
#                       所以这条断言只在有头 / CI(xvfb) 场景下才有意义
#
# 为什么用偏移量：写死日期明天就是过去时；车次查询的语义是「未来可取的车次」，
# 日期落到当天且已过末班车，结果必然为空，用例红得毫无信息量。

version: 1
suite: trains
marker: ui

cases:
  - id: sh-bj
    name: 上海-北京 冒烟
    from_city: 上海
    to_city: 北京
    depart_offset_days: 7
    min_results: 1
    expected_keyword: 车次
    tags: [smoke, sh-bj]
    expected:
      http_status: 200
      title_contains: 火车票

  - id: gz-sz
    name: 广州-深圳 冒烟
    from_city: 广州
    to_city: 深圳
    depart_offset_days: 10
    min_results: 1
    expected_keyword: 车次
    tags: [smoke, gz-sz]
    expected:
      http_status: 200
      title_contains: 火车票

  - id: hz-nj
    name: 杭州-南京 冒烟
    from_city: 杭州
    to_city: 南京
    depart_offset_days: 13
    min_results: 1
    expected_keyword: 车次
    tags: [smoke, hz-nj]
    expected:
      http_status: 200
      title_contains: 火车票

  # ---------------------------------------------------------------- 扩池（2026-11-07）
  #
  # 为什么加：原三条都是「一线 ↔ 一线」，一轮 3 次跑完；且上海-北京属长干线，
  # 车次多、渲染重。补的是公交化短途（南京-苏州、成都-重庆、武汉-长沙），
  # 结果页更轻、也更接近真人日常查询。
  #
  # 站名已用只读探针 `tools/probes/probe_city_pool_names.py`（2026-11-07）
  # 在火车票首页实选过：6/6 命中（其中「苏州」第一次点到了「苏州北」，
  # 页面对象重选后落回苏州 —— 这是既有重试逻辑，不是新问题）。
  # 该探针不提交搜索。
  #
  # 偏移量必须落在 +3..+15（预售期，见 utils/case_schema.py 的断言）。

  - id: nj-sz
    name: 南京-苏州 短途
    from_city: 南京
    to_city: 苏州
    depart_offset_days: 4
    min_results: 1
    expected_keyword: 车次
    tags: [pool, short-haul]
    expected:
      http_status: 200
      title_contains: 火车票

  - id: cd-cq
    name: 成都-重庆 短途
    from_city: 成都
    to_city: 重庆
    depart_offset_days: 8
    min_results: 1
    expected_keyword: 车次
    tags: [pool, short-haul]
    expected:
      http_status: 200
      title_contains: 火车票

  - id: wh-cs
    name: 武汉-长沙 中途
    from_city: 武汉
    to_city: 长沙
    depart_offset_days: 12
    min_results: 1
    expected_keyword: 车次
    tags: [pool, mid-haul]
    expected:
      http_status: 200
      title_contains: 火车票
#
# 偏移量上限的实测修正（2026-11-07）：原本这条写的是 +15，正好压在预售期边界上，
# 日历格显示「预约」而不是票价 —— 点它**不会改日期**，输入框停在默认值上，
# 用例报「点选后为 2026-11-10，期望 2026-11-22」。
# 所以 +3..+15 是 `utils/case_schema.py` 的**数据合法性**上限，
# 不等于「这站一定可售」；可售窗口按实测约在 +13 以内，这里取 +12。
