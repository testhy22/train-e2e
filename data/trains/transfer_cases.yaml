# 火车票**中转**用例数据（正例）
#
# 与另外两份的分工：
#   smoke_cases.yaml       单程，首页表单（选城市 → 日历 → 搜索）
#   round_trip_cases.yaml  往返，首页表单（点「往返」+ 两个日历），验证"两栏结果页渲染出什么"
#   本文件                  中转，首页表单（点「中转」），验证"方案是不是真两段拼成"
#
# **入口方式（2026-11-02 用户裁决）**：子菜单必须点按钮进，不许改 URL 直达；
# 只有一级菜单（trains.ctrip.com 首页）允许用 URL。所以本轨道从"URL 直达"改成了
# `open() → select_mode("transfer") → 填两地 → 点日期 → 点搜索`，
# URL 参数（ticketType=2 / dDate）只作断言依据。
#
# 「指定中转城市」**留空**：实测不填也能出方案（2026-11-02，汉口→深圳 201 张卡），
# 填它要另探一套联想面板，没有实测样本就不写定位器（避免 K-01 那类假通过）。
#
# **运行条数（2026-11-02 用户裁决）**：每功能默认最多 3 条 ⇒ 本文件正好 3 条，等于全量。
#
# 字段
#   id                  用例标识：小写 ASCII slug（进 junit 不能有中文）
#   name                中文名，报告展示用
#   from_city/to_city   站名
#   depart_offset_days  出发日相对今天的天数，区间 **+3..+15**（预售期，见 settings.MAX_PRESALE_DAYS）
#   min_cards           方案条数下界。**取实测值的约 1/3**，不按实测顶格写 ——
#                       方案数随余票波动（同一区间 +18 天实测只剩 70 张，+12 天有 196 张）
#   min_two_leg_ratio   「能抽出两段车次号」的卡片占比下界，默认 0.95。
#                       不写 1.0：实测存在抽不出第二程的卡（如「第二程 暂无」），写死会误红。
#
# 实测依据（2026-11-02 有头探测，tools/probes/probe_transfer2.py，产物在
# reports/probe/transfer_matrix_20261102-232428.json）：
#   汉口→深圳 2026-11-06  卡 205，含两段车次号 205
#   北京→上海 2026-11-15  卡 144，含两段车次号 143
#   广州→东莞 2026-11-14  卡 196，含两段车次号 181（差额来自 `S` 字头未被识别，已修）
#   广州→东莞 2026-11-20  卡  70，含两段车次号  54（+18 天，见下方注）
#
# 注（用户方案给的第三个日期 2026-11-20 是「今天 +18」）：实测当天确实还能查出 70 个方案，
# 说明站点接受这个日期；但本项目预售期口径是 `settings.MAX_PRESALE_DAYS = 15`
# （单程校验 `3..15` 就是在守它）。本轮**不改那个常量**——改它会影响单程与往返两条既有轨道，
# 属基础设施改动。所以第三条取 +12（同样在售、实测 196 个方案）作为执行口径，
# +18 的实测数字保留在报告与上方注释里，不丢。

version: 1
suite: trains_transfer

cases:
  # ---- 跨省长途（用户 Case 1，也就是截图 2 那条）
  - id: tr-hk-sz-longhaul
    name: 跨省长途-汉口到深圳
    from_city: 汉口
    to_city: 深圳
    depart_offset_days: 4
    min_cards: 60

  # ---- 干线高频（用户 Case 2）
  - id: tr-bj-sh-trunk
    name: 干线高频-北京到上海
    from_city: 北京
    to_city: 上海
    depart_offset_days: 13
    min_cards: 40

  # ---- 同省短途（用户 Case 3；日期取 +12 的原因见文件头那条注）
  - id: tr-gz-dg-short
    name: 同省短途-广州到东莞
    from_city: 广州
    to_city: 东莞
    depart_offset_days: 12
    min_cards: 50
