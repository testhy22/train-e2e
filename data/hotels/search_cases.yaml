  - id: nj-1n1r1a
    name: 南京-1晚1间1位
    city: 南京
    checkin_offset_days: 26
    nights: 1
    rooms: 1
    adults: 1
    children: 0
    tags: [pool, nj]
    expected:
      city_id: 12

  - id: cq-2n1r1a
    name: 重庆-2晚1间1位
    city: 重庆
